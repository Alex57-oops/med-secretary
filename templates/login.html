{% extends "base.html" %}

{% block title %}Вход — ИИ-секретарь{% endblock %}

{% block content %}
<div class="login-page">
    <div class="login-card">
        <div class="login-logo">
            <div class="login-logo-icon">⚕️</div>
        </div>
        <h1 class="login-title">ИИ-секретарь</h1>
        <p class="login-subtitle">Электронная документация приёма</p>

        {% if error %}
        <div class="error-message">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label class="form-label">Email</label>
                <input type="text" name="email" class="form-input" placeholder="your@email.ru" value="{{ email_value }}">
            </div>
            <div class="form-group">
                <label class="form-label">Пароль</label>
                <div class="password-wrapper">
                    <input type="password" name="password" id="password" class="form-input" placeholder="Введите пароль">
                    <button type="button" class="toggle-password" onclick="togglePassword()" aria-label="Показать пароль">
                        <span id="eye-icon">👁</span>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Войти в систему</button>
        </form>

        <p class="login-footer">
            Нет аккаунта? <a href="/register" style="color: var(--accent); text-decoration: none; font-weight: 600;">Зарегистрироваться</a>
        </p>
    </div>
</div>

<script>
function togglePassword() {
    var input = document.getElementById('password');
    var icon = document.getElementById('eye-icon');
    if (input.type === 'password') {
        input.type = 'text';
        icon.textContent = '🙈';
    } else {
        input.type = 'password';
        icon.textContent = '👁';
    }
}
</script>
{% endblock %}
